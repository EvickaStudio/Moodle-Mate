[project]
name = "moodle-mate"
version = "2.4.0"
description = "A Python application that fetches notifications from a Moodle instance (eg. a school or university) and delivers them to a notification platform like Discord. "
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=2.35.1",
    "requests>=2.33.1",
    "tiktoken>=0.12.0",
    "zipp>=3.23.1",
    "bleach==6.3.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.0",
    "urllib3>=2.6.3",
    "fastapi>=0.136.1",
    "uvicorn>=0.46.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.27",
    "cryptography>=48.0.0",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=4.6.0",
    "filelock>=3.29.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
    "types-requests>=2.33.0.20260503",
    "virtualenv>=21.3.1",
    "pyrefly>=0.64.0",
]

[tool.pyrefly.errors]
untyped-import = "ignore"
missing-source = "warn"
implicit-any-parameter = "ignore"
implicit-any = "ignore"

[project.scripts]
moodlemate = "moodlemate.main:main"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moodlemate"]

[tool.hatch.build.targets.wheel.force-include]
"src/moodlemate/web/static" = "moodlemate/web/static"
"src/moodlemate/web/templates" = "moodlemate/web/templates"

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["moodlemate"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra", "--strict-markers", "--strict-config"]


[tool.pyrefly]
project-includes = ["src/moodlemate"]
search-path = ["src"]
project-excludes = [
    "**/__pycache__",
    ".git",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "venv",
    "build",
    "dist",
]
python-platform = "linux"
python-version = "3.11.0"
infer-with-first-use = false
