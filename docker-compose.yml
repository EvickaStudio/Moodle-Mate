services:
  moodlemate:
    build:
      context: .
      dockerfile: Dockerfile
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    env_file:
      - .env
    ports:
      - "127.0.0.1:${MOODLEMATE_WEB__PORT:-9095}:${MOODLEMATE_WEB__PORT:-9095}"
    volumes:
      - ./state:/app/state
      - ./logs:/app/logs
    restart: unless-stopped
    environment:
      - TZ=${TZ:-UTC}
      - MOODLEMATE_WEB__HOST=0.0.0.0
      - MOODLE_SESSION_FILE=/app/state/moodle_session.json
      - MOODLE_STATE_DIR=/app/state
