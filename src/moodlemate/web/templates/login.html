<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in · Moodle Mate</title>
    <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
    <style>
        :root {
            color-scheme: dark;
            --bg: #141414;
            --surface: #181818;
            --ring: rgba(255, 255, 255, .1);
            --text: #f0f0f0;
            --muted: rgba(240, 240, 240, .6);
        }
        * { box-sizing: border-box; }
        body { min-height: 100dvh; margin: 0; display: flex; flex-direction: column; background: var(--bg); color: var(--text); font: 13px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
        button, input { font: inherit; }
        button { cursor: pointer; }
        button:focus-visible, input:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
        h1, p { margin: 0; }
        .topbar { display: flex; align-items: center; height: 64px; padding: 16px 28px; }
        .brand { display: flex; align-items: center; gap: 9px; font-weight: 600; font-size: 14px; letter-spacing: -.025em; }
        .brand img { width: 25px; height: 22px; object-fit: contain; }
        .layout { flex: 1; display: grid; place-items: center; padding: 48px 24px 96px; }
        .panel { width: min(100%, 340px); }
        .workspace-mark { display: grid; place-items: center; width: 44px; height: 44px; margin-bottom: 24px; border: 1px solid var(--ring); border-radius: 10px; background: var(--surface); }
        .workspace-mark img { width: 28px; height: 24px; object-fit: contain; }
        .panel-header h1 { font-size: 22px; font-weight: 600; line-height: 1.3; letter-spacing: -.035em; }
        .panel-header p { margin-top: 10px; color: var(--muted); font-size: 12px; }
        .panel-body { margin-top: 28px; }
        label { display: block; margin-bottom: 8px; color: var(--muted); font-size: 12px; }
        input { width: 100%; min-height: 38px; padding: 8px 12px; border: 1px solid var(--ring); border-radius: 5px; background: #202020; color: var(--text); font-size: 16px; }
        input:hover { border-color: rgba(255, 255, 255, .2); }
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 36px; margin-top: 16px; padding: 8px 12px; border: 0; border-radius: 5px; background: #f0f0f0; color: #181818; font-size: 12px; font-weight: 500; }
        .btn svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
        .btn:hover { background: #d9d9d9; }
        .btn:disabled { opacity: .5; cursor: default; }
        .error { display: none; margin-top: 16px; color: #f58b8b; font-size: 12px; }
        .error.show { display: block; }
        .panel-note { margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--ring); color: var(--muted); font-size: 11px; }
        .footer { padding: 20px 24px; color: var(--muted); font-size: 11px; text-align: center; }
        @media (max-width: 480px) {
            .topbar { height: 56px; padding: 16px 24px; }
            .layout { padding-block: 40px 64px; }
        }
    </style>
</head>
<body>
<header class="topbar">
    <div class="brand">
        <img src="/static/icon.svg" alt="">
        <span>Moodle Mate</span>
    </div>
</header>
<main class="layout">
    <section class="panel" aria-labelledby="login-title">
        <div class="panel-header">
            <div class="workspace-mark"><img src="/static/icon.svg" alt=""></div>
            <h1 id="login-title">Sign in to Moodle Mate</h1>
            <p>Your notifications, summaries, and delivery settings.</p>
        </div>
        <form id="login-form" class="panel-body">
            <label for="password">Dashboard password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
            <button id="submit" class="btn" type="submit">Sign in <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-5-5 5 5-5 5"/></svg></button>
            <div id="error" class="error" role="alert"></div>
        </form>
        <p class="panel-note">Use the dashboard password configured for this instance.</p>
    </section>
</main>
<footer class="footer">Moodle Mate · Notification service</footer>
<script>
    function getCookie(name) {
        const part = document.cookie.split("; ").find((item) => item.startsWith(`${name}=`));
        return part ? decodeURIComponent(part.split("=").slice(1).join("=")) : "";
    }

    document.getElementById("login-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const button = document.getElementById("submit");
        const error = document.getElementById("error");
        button.disabled = true;
        error.className = "error";
        try {
            const response = await fetch("/api/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRF-Token": getCookie("moodlemate_csrf")
                },
                body: JSON.stringify({ password: document.getElementById("password").value })
            });
            if (!response.ok) throw new Error(response.status === 429 ? "Too many attempts. Try again later." : "Incorrect password.");
            window.location.href = "/";
        } catch (exception) {
            error.textContent = exception.message || "Sign in failed. Try again.";
            error.className = "error show";
        } finally {
            button.disabled = false;
        }
    });
</script>
</body>
</html>
