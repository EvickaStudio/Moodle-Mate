<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in · Moodle Mate</title>
    <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
    <style>
        :root {
            color-scheme: dark;
            --bg: #000000;
            --surface: #111113;
            --border: #36363b;
            --text: #f3f3f1;
            --muted: #99999f;
            --accent: #8b5cf6;
            --accent-dark: #7547e8;
            --danger-bg: #512b2b;
            --danger-text: #ffd4d4;
        }
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            margin: 0;
            padding: 32px clamp(24px, 8vw, 110px);
            background: var(--bg);
            color: var(--text);
            font: 14px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        main {
            width: min(100%, 980px);
            min-height: calc(100vh - 64px);
            margin: 0 auto;
            display: grid;
            grid-template-rows: auto 1fr;
        }
        .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; }
        .brand img { width: 24px; height: 24px; }
        .login-layout {
            width: min(100%, 650px);
            margin: auto;
            display: grid;
            grid-template-columns: minmax(0, .9fr) 1px minmax(0, 1.1fr);
            gap: 34px;
            align-items: center;
        }
        .divider { width: 1px; height: 170px; background: var(--border); }
        .intro .mini-brand { display: flex; align-items: center; gap: 7px; margin-bottom: 14px; font-weight: 650; }
        .intro .mini-brand img { width: 22px; height: 22px; }
        h1 { max-width: 260px; margin: 0 0 10px; font-size: 31px; line-height: 1.08; letter-spacing: -.035em; font-weight: 500; }
        p { max-width: 270px; margin: 0; color: var(--muted); font-size: 13px; }
        form { width: 100%; }
        label { display: block; margin-bottom: 6px; font-size: 12px; font-weight: 650; }
        input { width: 100%; min-height: 40px; border-radius: 5px; font: inherit; border: 1px solid #252528; padding: 8px 11px; color: var(--text); background: #171719; }
        input:focus-visible, button:focus-visible { outline: 3px solid rgba(49, 95, 140, .25); outline-offset: 2px; }
        button { min-height: 34px; margin-top: 16px; padding: 6px 14px; border: 1px solid #f2f2f0; border-radius: 999px; background: #f2f2f0; color: #0b0b0c; font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; }
        button:hover { background: #d9d9d6; }
        button:disabled { opacity: .55; cursor: not-allowed; }
        .error { display: none; margin-top: 14px; padding: 9px 10px; border: 1px solid #ebc5c5; border-radius: 6px; background: var(--danger-bg); color: var(--danger-text); }
        .error.show { display: block; }
        @media (max-width: 650px) {
            body { padding: 24px; }
            main { min-height: calc(100vh - 48px); }
            .login-layout { grid-template-columns: 1fr; gap: 24px; }
            .divider { width: 100%; height: 1px; }
            h1 { font-size: 28px; }
        }
    </style>
</head>
<body>
<main>
    <div class="brand">
        <img src="/static/icon.svg" alt="">
        <span>Moodle Mate</span>
    </div>
    <div class="login-layout">
        <section class="intro">
            <div class="mini-brand"><img src="/static/icon.svg" alt=""><span>Admin access</span></div>
            <h1>Open your dashboard.</h1>
            <p>Review Moodle notifications, delivery history, service health, and runtime settings.</p>
        </section>
        <div class="divider" aria-hidden="true"></div>
        <form id="login-form">
            <label for="password">Dashboard password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
            <button id="submit" type="submit">Sign in</button>
            <div id="error" class="error" role="alert"></div>
        </form>
    </div>
</main>
<script>
    function getCookie(name) {
        const part = document.cookie.split("; ").find((item) => item.startsWith(`${name}=`));
        return part ? decodeURIComponent(part.split("=").slice(1).join("=")) : "";
    }

    document.getElementById("login-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const button = document.getElementById("submit");
        const error = document.getElementById("error");
        button.disabled = true;
        error.className = "error";
        try {
            const response = await fetch("/api/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRF-Token": getCookie("moodlemate_csrf")
                },
                body: JSON.stringify({ password: document.getElementById("password").value })
            });
            if (!response.ok) throw new Error(response.status === 429 ? "Too many attempts. Try again later." : "Incorrect password.");
            window.location.href = "/";
        } catch (exception) {
            error.textContent = exception.message || "Sign in failed. Try again.";
            error.className = "error show";
        } finally {
            button.disabled = false;
        }
    });
</script>
</body>
</html>
