name: CI

on:
  push:
    branches:
    - main
    - dev
  pull_request:
    branches:
    - main
    - dev

jobs:
  lint:
    name: Lint, format, and type check (uv + Ruff + Pyrefly)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.11", "3.12" ]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Setup uv with cache
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true

    - name: Sync dependencies
      run: uv sync --extra dev --frozen

    - name: CI lint checks
      run: make ci-lint

    - name: Verify hashed development requirements
      if: matrix.python-version == '3.11'
      run: python -m pip --python .venv/bin/python install --dry-run --ignore-installed --require-hashes -r requirements-dev.txt

    - name: Build and smoke-test installed wheel
      run: |
        uv build --wheel --out-dir "$RUNNER_TEMP/moodlemate-wheel"
        uv venv --python "${{ matrix.python-version }}" "$RUNNER_TEMP/moodlemate-wheel-venv"
        uv pip install --python "$RUNNER_TEMP/moodlemate-wheel-venv/bin/python" --require-hashes -r requirements.txt
        uv pip install --python "$RUNNER_TEMP/moodlemate-wheel-venv/bin/python" --no-deps "$RUNNER_TEMP/moodlemate-wheel/"*.whl
        "$RUNNER_TEMP/moodlemate-wheel-venv/bin/python" -I -m moodlemate --help
        "$RUNNER_TEMP/moodlemate-wheel-venv/bin/python" -I - <<'PY'
        from importlib.resources import files
        root = files("moodlemate") / "web"
        for asset in ("templates/index.html", "templates/login.html", "static/icon.svg"):
            assert root.joinpath(asset).is_file(), f"Missing wheel asset: {asset}"
        PY

    - name: Minimize uv cache
      if: always()
      run: uv cache prune --ci
